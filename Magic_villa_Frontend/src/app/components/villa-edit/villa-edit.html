<div class="edit-container">
  <div class="form-card" *ngIf="!loading">
    <div class="header">
      <span class="badge">Editing Property #{{ villa.id }}</span>
      <h1>Edit Property</h1>
      <p>Refine this listing and save the updated details.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #editForm="ngForm">
      <div class="form-group">
        <label for="name">Property Name *</label>
        <input type="text" id="name" name="name" [(ngModel)]="villa.name" required minlength="3" />
      </div>

      <div class="form-group">
        <label for="propertyType">Category *</label>
        <select id="propertyType" name="propertyType" [(ngModel)]="villa.propertyType" required>
          <option value="Villa">Villa</option>
          <option value="HotelRoom">Hotel Room</option>
          <option value="Apartment">Apartment</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Details</label>
        <textarea id="description" name="description" [(ngModel)]="villa.description" placeholder="Describe the experience" rows="3"></textarea>
      </div>

      <div class="form-group">
        <label for="imageUrl">Image URL</label>
        <input type="url" id="imageUrl" name="imageUrl" [(ngModel)]="villa.imageUrl" placeholder="https://example.com/property.jpg" />
      </div>

      <div class="form-group">
        <label for="amenities">Amenities</label>
        <input type="text" id="amenities" name="amenities" [(ngModel)]="villa.amenities" placeholder="Pool, Wi-Fi, chef service" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="price">Rate per night (Rs.) *</label>
          <input type="number" id="price" name="price" [(ngModel)]="villa.price" min="1" required />
        </div>
        <div class="form-group">
          <label for="sqft">Square Feet *</label>
          <input type="number" id="sqft" name="sqft" [(ngModel)]="villa.sqft" min="1" required />
        </div>
        <div class="form-group">
          <label for="occupancy">Guests *</label>
          <input type="number" id="occupancy" name="occupancy" [(ngModel)]="villa.occupancy" min="1" required />
        </div>
      </div>

      <div class="buttons">
        <button type="button" class="cancel-btn" (click)="cancel()">Cancel</button>
        <button type="submit" class="save-btn" [disabled]="!editForm.form.valid || submitting">
          {{ submitting ? 'Updating...' : 'Update Property' }}
        </button>
      </div>
    </form>
  </div>

  <div class="empty-state" *ngIf="loading || errorMessage">
    <p>{{ errorMessage || 'Loading property...' }}</p>
  </div>
</div>
