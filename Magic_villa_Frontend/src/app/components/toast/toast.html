<div class="toast-stack" aria-live="polite">
  <div class="toast" *ngFor="let item of toast.toasts$ | async" [class.toast-error]="item.type === 'error'">
    <span>{{ item.type === 'success' ? '✓' : '!' }}</span><p>{{ item.message }}</p><button type="button" (click)="toast.dismiss(item.id)" aria-label="Dismiss notification">×</button>
  </div>
</div>
